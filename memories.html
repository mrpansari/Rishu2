<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us Page</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;

    background-color: #fffaf7;
    background-image: 
        linear-gradient(#e8e2dc 1px, transparent 1px),
        linear-gradient(90deg, #e8e2dc 1px, transparent 1px);
    background-size: 60px 60px;

    overflow: hidden;
    position: relative;
}

/* SMALLER HEART */
.heart-bg {
    position: absolute;
    width: 420px;
    height: 420px;
    background: #e47c73;
    opacity: 0.25;
    transform: rotate(-45deg);
    top: 50%;
    left: 50%;
    margin-top: -210px;
    margin-left: -210px;
    z-index: 1;
}

.heart-bg::before,
.heart-bg::after {
    content: "";
    position: absolute;
    width: 420px;
    height: 420px;
    background: #e47c73;
    border-radius: 50%;
}

.heart-bg::before {
    top: -210px;
    left: 0;
}

.heart-bg::after {
    left: 210px;
    top: 0;
}

/* POLAROID FRAME */
.polaroid {
    position: absolute;
    width: 330px; /* frame slightly bigger than image */
    background: white;
    padding: 20px 20px 60px 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    z-index: 3;
    transition: 0.3s ease;
}

/* IMAGE FIXED SIZE */
.polaroid img {
    width: 300px;
    height: 300px;
    object-fit: cover; /* prevents stretching */
    display: block;
}

/* CLIP */
.clip {
    position: absolute;
    width: 60px;
    height: 70px;
    background: #dcdcdc;
    border-radius: 6px;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}

//* LEFT PHOTO */
.photo1 {
    top: 130px;
    left: 50%;          /* moved inward */
    transform: rotate(-6deg);
    z-index: 4;         /* slightly above */
}

/* RIGHT PHOTO */
.photo2 {
    top: 150px;
    right: 42%;          /* closer to left photo */
    transform: rotate(6deg);
    z-index: 3;
}


/* STARS */
.star {
    position: absolute;
    font-size: 40px;
    color: #e47c73;
    z-index: 4;
}

.star1 {
    bottom: 120px;
    left: 30%;
}

.star2 {
    bottom: 140px;
    right: 30%;
}

/* DOODLES */
.cup {
    position: absolute;
    bottom: 60px;
    left: 60px;
    font-size: 60px;
    color: #e47c73;
}

.cherry {
    position: absolute;
    bottom: 60px;
    right: 60px;
    font-size: 70px;
    z-index: 5;
}

/* HOVER */
.polaroid:hover {
    transform: scale(1.05) rotate(0deg);
}
</style>
</head>

<body>

<div class="heart-bg"></div>

<!-- LEFT PHOTO -->
<div class="polaroid photo1">
    <div class="clip"></div>
    <img src="image/daaman.jpeg">
</div>

<!-- RIGHT PHOTO -->
<div class="polaroid photo2">
    <div class="clip"></div>
    <img src="image/rishu.jpeg">
</div>

<!-- Stars -->
<!-- <div class="star star1">★</div>
<div class="star star2">★</div> -->

<!-- Cute doodles -->
<div class="cup">☕</div>
<div class="cherry">🍒</div>

</body>
</html>
