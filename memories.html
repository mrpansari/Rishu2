<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        font-family: 'Georgia', serif;
        background: linear-gradient(135deg, #3a0f2d, #7b1e3c);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .container {
        display: flex;
        width: 90%;
        max-width: 1100px;
        align-items: center;
        justify-content: space-between;
    }

    .photos {
        position: relative;
        width: 45%;
    }

    .photos img {
        width: 220px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        position: absolute;
        transition: transform 0.4s ease;
    }

    .photo1 {
        top: 0;
        left: 0;
        transform: rotate(-8deg);
    }

    .photo2 {
        top: 120px;
        left: 120px;
        transform: rotate(6deg);
    }

    .photos img:hover {
        transform: scale(1.05);
    }

    .text {
        width: 50%;
    }

    .text h1 {
        font-size: 3rem;
        margin-bottom: 20px;
        font-style: italic;
    }

    .text p {
        font-size: 1.2rem;
        line-height: 1.6;
    }

</style>
</head>

<body>

<audio autoplay loop>
    <source src="romantic.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <div class="photos">
        <!-- Replace with your actual image names -->
        <img src="photo1.jpg" class="photo1">
        <img src="photo2.jpg" class="photo2">
    </div>

    <div class="text">
        <h1>Happy Valentine’s Day ❤️</h1>
        <p>
            This Valentine’s Day, I’m just grateful for us —
            for every laugh, every moment, every memory we’ve shared.
        </p>
        <p>
            You are my favourite person.
            Today, tomorrow, always.
        </p>
    </div>

</div>

</body>
</html>
