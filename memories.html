<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us Page</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;

    /* grid background */
    background-color: #fffaf7;
    background-image: 
        linear-gradient(#e8e2dc 1px, transparent 1px),
        linear-gradient(90deg, #e8e2dc 1px, transparent 1px);
    background-size: 60px 60px;

    overflow: hidden;
    position: relative;
}

/* SMALLER HEART BACKGROUND */
.heart-bg {
    position: absolute;
    width: 420px;        /* reduced */
    height: 420px;       /* reduced */
    background: #e47c73;
    opacity: 0.25;
    transform: rotate(-45deg);
    top: 50%;
    left: 50%;
    margin-top: -210px;  /* half of height */
    margin-left: -210px; /* half of width */
    z-index: 1;
}

.heart-bg::before,
.heart-bg::after {
    content: "";
    position: absolute;
    width: 420px;        /* reduced */
    height: 420px;       /* reduced */
    background: #e47c73;
    border-radius: 50%;
}

.heart-bg::before {
    top: -210px;
    left: 0;
}

.heart-bg::after {
    left: 210px;
    top: 0;
}

/* POLAROID STYLE */
.polaroid {
    position: absolute;
    width: 240px; /* slightly reduced */
    background: white;
    padding: 15px 15px 40px 15px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    z-index: 3;
    transition: 0.3s ease;
}

.polaroid img {
    width: 100%;
    display: block;
}

/* CLIP */
.clip {
    position: absolute;
    width: 45px;
    height: 55px;
    background: #dcdcdc;
    border-radius: 6px;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}

/* LEFT PHOTO */
.photo1 {
    top: 220px;
    left: 32%;
    transform: rotate(-6deg);
}

/* RIGHT PHOTO */
.photo2 {
    top: 240px;
    left: 48%;
    transform: rotate(6deg);
}

/* STAR STICKERS */
.star {
    position: absolute;
    font-size: 36px;
    color: #e47c73;
    z-index: 4;
}

.star1 {
    top: 430px;
    left: 36%;
}

.star2 {
    top: 450px;
    left: 56%;
}

/* CUP DOODLE */
.cup {
    position: absolute;
    bottom: 100px;
    left: 80px;
    font-size: 60px;
    color: #e47c73;
}

/* CHERRY STICKER */
.cherry {
    position: absolute;
    bottom: 80px;
    right: 80px;
    font-size: 70px;
    z-index: 5;
}

/* Optional hover effect */
.polaroid:hover {
    transform: scale(1.05) rotate(0deg);
}
</style>
</head>

<body>

<div class="heart-bg"></div>

<!-- LEFT PHOTO -->
<div class="polaroid photo1">
    <div class="clip"></div>
    <img src="image/daaman.jpeg">
</div>

<!-- RIGHT PHOTO -->
<div class="polaroid photo2">
    <div class="clip"></div>
    <img src="image/rishu.jpeg">
</div>

<!-- Stars -->
<div class="star star1">★</div>
<div class="star star2">★</div>

<!-- Cute doodles -->
<div class="cup">☕</div>
<div class="cherry">🍒</div>

</body>
</html>
