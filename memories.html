<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us Page</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;

    background-color: #fffaf7;
    background-image: 
        linear-gradient(#e8e2dc 1px, transparent 1px),
        linear-gradient(90deg, #e8e2dc 1px, transparent 1px);
    background-size: 60px 60px;

    overflow: hidden;
    position: relative;
}

/* HEART BACKGROUND */
.heart-bg {
    position: absolute;
    width: 450px;
    height: 450px;
    background: #e47c73;
    opacity: 0.25;
    transform: rotate(-45deg);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-45deg);
    z-index: 1;
}

.heart-bg::before,
.heart-bg::after {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    background: #e47c73;
    border-radius: 50%;
}

.heart-bg::before {
    top: -225px;
    left: 0;
}

.heart-bg::after {
    left: 225px;
    top: 0;
}

/* POLAROID FRAME */
.polaroid {
    position: absolute;
    width: 540px; /* frame slightly larger than image */
    background: white;
    padding: 20px 20px 70px 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    z-index: 3;
    transition: 0.3s ease;
}

/* IMAGE FIXED SIZE */
.polaroid img {
    width: 500px;
    height: 500px;
    object-fit: cover;
    display: block;
}

/* CLIP */
.clip {
    position: absolute;
    width: 70px;
    height: 80px;
    background: #dcdcdc;
    border-radius: 6px;
    top: -45px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}

/* LEFT PHOTO */
.photo1 {
    top: 120px;
    left: 50%;
    transform: translateX(-120%) rotate(-6deg);
}

/* RIGHT PHOTO */
.photo2 {
    top: 140px;
    left: 50%;
    transform: translateX(20%) rotate(6deg);
}

/* DOODLES */
.cup {
    position: absolute;
    bottom: 60px;
    left: 60px;
    font-size: 60px;
    color: #e47c73;
}

.cherry {
    position: absolute;
    bottom: 60px;
    right: 60px;
    font-size: 70px;
}
</style>
</head>

<body>

<div class="heart-bg"></div>

<!-- LEFT PHOTO -->
<div class="polaroid photo1">
    <div class="clip"></div>
    <img src="image/daaman.jpeg">
</div>

<!-- RIGHT PHOTO -->
<div class="polaroid photo2">
    <div class="clip"></div>
    <img src="image/rishu.jpeg">
</div>

<div class="cup">☕</div>
<div class="cherry">🍒</div>

</body>
</html>
