<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us Page</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;

    background-color: #fffaf7;
    background-image: 
        linear-gradient(#e8e2dc 1px, transparent 1px),
        linear-gradient(90deg, #e8e2dc 1px, transparent 1px);
    background-size: 60px 60px;

    overflow: hidden;
    position: relative;
}

/* HEART BACKGROUND */
.heart-bg {
    position: absolute;
    width: 420px;
    height: 420px;
    background: #e47c73;
    opacity: 0.25;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-45deg);
    z-index: 1;
}

.heart-bg::before,
.heart-bg::after {
    content: "";
    position: absolute;
    width: 420px;
    height: 420px;
    background: #e47c73;
    border-radius: 50%;
}

.heart-bg::before {
    top: -210px;
    left: 0;
}

.heart-bg::after {
    left: 210px;
    top: 0;
}

/* CENTER WRAPPER */
.photo-wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 60px;
    z-index: 3;
}

/* POLAROID FRAME */
.polaroid {
    width: 340px; /* slightly larger than image */
    background: white;
    padding: 20px 20px 50px 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    transition: 0.3s ease;
    position: relative;
}

/* IMAGE SIZE FIXED */
.polaroid img {
    width: 300px;
    height: 300px;
    object-fit: cover;
    display: block;
}

/* CLIP */
.clip {
    position: absolute;
    width: 60px;
    height: 70px;
    background: #dcdcdc;
    border-radius: 6px;
    top: -35px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}

/* Slight Tilt */
.photo1 {
    transform: rotate(-5deg);
}

.photo2 {
    transform: rotate(5deg);
}

/* HOVER EFFECT */
.polaroid:hover {
    transform: scale(1.05) rotate(0deg);
}

/* DOODLES */
.cup {
    position: absolute;
    bottom: 60px;
    left: 60px;
    font-size: 60px;
    color: #e47c73;
}

.cherry {
    position: absolute;
    bottom: 60px;
    right: 60px;
    font-size: 70px;
}
</style>
</head>

<body>

<div class="heart-bg"></div>

<div class="photo-wrapper">

    <!-- LEFT PHOTO -->
    <div class="polaroid photo1">
        <div class="clip"></div>
        <img src="image/daaman.jpeg">
    </div>

    <!-- RIGHT PHOTO -->
    <div class="polaroid photo2">
        <div class="clip"></div>
        <img src="image/rishu.jpeg">
    </div>

</div>

<div class="cup">☕</div>
<div class="cherry">🍒</div>

</body>
</html>
