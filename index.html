<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Rishu ❤️</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff4e8a, #ff9ecf);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    text-align: center;
    color: white;
}

h1 {
    font-size: 2.5rem;
    margin-bottom: 40px;
}

.buttons {
    position: relative;
    height: 150px;
}

button {
    padding: 15px 40px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
}

/* YES button */
#yesBtn {
    background: white;
    color: #ff4e8a;
    margin-right: 20px;
}

/* NO button */
#noBtn {
    background: #ff1e56;
    color: white;
    position: absolute;
    transition: left 0.2s ease, top 0.2s ease;
}

button:hover {
    transform: scale(1.05);
}

</style>
</head>

<body>

<div class="container">
    <h1>Rishu, will you be my Valentine? 💖</h1>

    <div class="buttons">
        <button id="yesBtn" onclick="goNext()">Yes 💘</button>
        <button id="noBtn">No 😢</button>
    </div>
</div>

<script>

const noBtn = document.getElementById("noBtn");
let attempts = 0;

/* Initial placement */
noBtn.style.left = "200px";
noBtn.style.top = "0px";

noBtn.addEventListener("mouseover", moveButton);

function moveButton() {

    const padding = 20;
    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;

    const maxX = window.innerWidth - btnWidth - padding;
    const maxY = window.innerHeight - btnHeight - padding;

    let newX, newY;

    // First 6 tries → small movement
    if (attempts < 6) {
        const currentX = noBtn.offsetLeft;
        const currentY = noBtn.offsetTop;

        newX = currentX + (Math.random() * 200 - 100);
        newY = currentY + (Math.random() * 150 - 75);
    } 
    // After that → full random dodge
    else {
        newX = Math.random() * maxX;
        newY = Math.random() * maxY;
    }

    // Keep inside screen boundaries
    newX = Math.max(padding, Math.min(newX, maxX));
    newY = Math.max(padding, Math.min(newY, maxY));

    noBtn.style.left = newX + "px";
    noBtn.style.top = newY + "px";

    attempts++;
}

/* YES button action */
function goNext() {
    window.location.href = "letter.html"; 
    // change to your next page file name
}

</script>

</body>
</html>
