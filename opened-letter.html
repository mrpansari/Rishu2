<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    font-family: 'Playfair Display', serif;
}

/* LEFT IMAGE SECTION */
.left-side {
    width: 40%;
    height: 100vh;
    background: url("image/flower.jpg") no-repeat center center;
    background-size: cover;
}

/* RIGHT CONTENT SECTION */
.right-side {
    width: 60%;
    background: linear-gradient(to right, #7b1e3c, #b3375b);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    color: white;
    text-align: center;
    padding: 40px;
}

/* Title */
.title {
    font-family: 'Great Vibes', cursive;
    font-size: 80px;
    line-height: 1.1;
    margin-bottom: 20px;
}

/* Message */
.message {
    font-size: 20px;
    line-height: 1.7;
    max-width: 650px;
    margin: 0 auto;
}

/* Heart Button */
.heart-btn {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 100px;
    background: #ffb6c1;
    clip-path: path("M55 90 C10 55 0 35 0 20 C0 5 15 0 30 0 C45 0 55 15 55 15 C55 15 65 0 80 0 C95 0 110 5 110 20 C110 35 100 55 55 90 Z");
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #7b1e3c;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.heart-btn:hover {
    transform: translateX(-50%) scale(1.1);
}

</style>
</head>

<body>

<div class="left-side"></div>

<div class="right-side">

    <div>
        <div class="title">
            Happy <br> Valentine’s Day
        </div>

        <div class="message">
            This Valentine’s Day, I’m just grateful for us—
            for every moment we’ve shared and for choosing
            each other every day. You’re my favourite, always.
        </div>
    </div>

    <div class="heart-btn" onclick="window.location.href='memories.html'">
        CLICK<br>ME
    </div>

</div>

</body>
</html>
