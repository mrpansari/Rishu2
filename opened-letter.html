<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    font-family: 'Playfair Display', serif;
}

/* LEFT SIDE (40%) */
.left-side {
    width: 40%;
    height: 100vh;
    background: url("image/flower.jpg") no-repeat center center;
    background-size: cover;
    position: relative;
    padding: 40px 20px;
    box-sizing: border-box;
}

/* Calendar (NOW ON TOP) */
.calendar {
    width: 220px;
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    margin-bottom: 30px;
    font-size: 14px;
}

.calendar h3 {
    margin: 0 0 10px 0;
    text-align: center;
    font-weight: 600;
}

.calendar table {
    width: 100%;
    text-align: center;
    border-collapse: collapse;
}

.calendar th {
    font-size: 11px;
    color: #b3375b;
}

.calendar td {
    padding: 4px;
}

/* Highlight 14 */
.highlight {
    background: #ffb6c1;
    border-radius: 50%;
    font-weight: bold;
}

/* Memories Image (NOW BELOW CALENDAR) */
.memories {
    width: 240px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

/* RIGHT SIDE (60%) */
.right-side {
    width: 60%;
    background: linear-gradient(to right, #7b1e3c, #b3375b);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    color: white;
    text-align: center;
    padding: 40px;
}

/* Title */
.title {
    font-family: 'Great Vibes', cursive;
    font-size: 80px;
    line-height: 1.1;
    margin-bottom: 20px;
}

/* Message */
.message {
    font-size: 20px;
    line-height: 1.7;
    max-width: 650px;
    margin: 0 auto;
}

/* Heart Button */
.heart-btn {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 100px;
    background: #ffb6c1;
    clip-path: path("M55 90 C10 55 0 35 0 20 C0 5 15 0 30 0 C45 0 55 15 55 15 C55 15 65 0 80 0 C95 0 110 5 110 20 C110 35 100 55 55 90 Z");
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #7b1e3c;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.heart-btn:hover {
    transform: translateX(-50%) scale(1.1);
}

</style>
</head>

<body>

<!-- LEFT SIDE -->
<div class="left-side">

    <!-- Calendar on top -->
    <div class="calendar">
        <h3>February 2026</h3>
        <table>
            <tr>
                <th>S</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th>
            </tr>
            <tr>
                <td></td><td></td><td></td><td></td><td></td><td></td><td>1</td>
            </tr>
            <tr>
                <td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td>
            </tr>
            <tr>
                <td>9</td><td>10</td><td>11</td><td>12</td><td>13</td>
                <td class="highlight">14</td>
                <td>15</td>
            </tr>
            <tr>
                <td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td>
            </tr>
            <tr>
                <td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td>28</td><td></td>
            </tr>
        </table>
    </div>

    <!-- Memories image below -->
    <img src="image/memories.jpeg" class="memories">

</div>

<!-- RIGHT SIDE -->
<div class="right-side">

    <div>
        <div class="title">
            Happy <br> Valentine’s Day
        </div>

        <div class="message">
            This Valentine’s Day, I’m just grateful for us—
            for every moment we’ve shared and for choosing
            each other every day. You’re my favourite, always.
        </div>
    </div>

    <div class="heart-btn" onclick="window.location.href='memories.html'">
        CLICK<br>ME
    </div>

</div>

</body>
</html>
