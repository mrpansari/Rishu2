<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    font-family: 'Playfair Display', serif;
}

/* LEFT SIDE */
.left-side {
    width: 40%;
    height: 100vh;
    background: url("image/flower.jpg") no-repeat center center;
    background-size: cover;
    position: relative;
}

/* Memories Image */
.memories {
    position: absolute;
    top: 120px;
    left: 160px;
    width: 250px;
    transform: rotate(-5deg);
    box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    border-radius: 6px;
}

/* Calendar overlapping */
.calendar {
    position: absolute;
    top: 90px;
    left: 200px;
    width: 210px;
    background: #f8f4ef;
    padding: 15px;
    transform: rotate(4deg);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    border-radius: 8px;
    font-size: 13px;
}

.calendar h3 {
    margin: 0 0 8px 0;
    font-weight: 500;
}

.calendar table {
    width: 100%;
    text-align: center;
    border-collapse: collapse;
}

.calendar th {
    font-size: 10px;
    color: #b3375b;
}

.calendar td {
    padding: 3px;
}

/* Highlight 14 */
.highlight {
    color: #b3375b;
    font-weight: bold;
}

/* Decorative small hearts */
.decor-heart {
    position: absolute;
    top: 70px;
    left: 240px;
    font-size: 20px;
}

/* RIGHT SIDE */
.right-side {
    width: 60%;
    background: linear-gradient(to bottom right, #8e2a4f, #b94b68);
    color: #f8e8e8;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px;
    position: relative;
}

/* Title */
.title {
    font-family: 'Great Vibes', cursive;
    font-size: 90px;
    line-height: 1.1;
    margin-bottom: 30px;
}

/* Message */
.message {
    font-size: 22px;
    line-height: 1.8;
    max-width: 650px;
}

/* Heart Button */
.heart-btn {
    margin-top: 60px;
    width: 120px;
    height: 110px;
    background: linear-gradient(to bottom, #ffb6c1, #ff8fa3);
    clip-path: path("M60 100 C10 60 0 40 0 25 C0 10 18 0 35 0 C50 0 60 18 60 18 C60 18 70 0 85 0 C102 0 120 10 120 25 C120 40 110 60 60 100 Z");
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #7b1e3c;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.heart-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<!-- LEFT -->
<div class="left-side">

    <img src="image/memories.jpeg" class="memories">

    <div class="calendar">
        <h3>February 2026</h3>
        <table>
            <tr>
                <th>S</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th>
            </tr>
            <tr>
                <td></td><td></td><td></td><td></td><td></td><td></td><td>1</td>
            </tr>
            <tr>
                <td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td>
            </tr>
            <tr>
                <td>9</td><td>10</td><td>11</td><td>12</td><td>13</td>
                <td class="highlight">14</td>
                <td>15</td>
            </tr>
            <tr>
                <td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td>
            </tr>
            <tr>
                <td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td>28</td><td></td>
            </tr>
        </table>
    </div>

    <div class="decor-heart">💕</div>

</div>

<!-- RIGHT -->
<div class="right-side">

    <div class="title">
        Happy <br> Valentine’s Day
    </div>
