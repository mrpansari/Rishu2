<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Valentine's Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    font-family: 'Playfair Display', serif;
    position: relative;
    transition: opacity 0.8s ease;
}

.fade-out {
    opacity: 0;
}

/* LEFT BACKGROUND */
.left-side {
    position: absolute;
    width: 40%;
    height: 100vh;
    background: url("image/flower.jpg") no-repeat center center;
    background-size: cover;
    z-index: 2;
}

/* RIGHT PANEL */
.right-side {
    position: absolute;
    right: 0;
    width: 60%;
    height: 100vh;
    background: linear-gradient(to bottom right, #8e2a4f, #b94b68);
    color: #f8e8e8;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px;
    z-index: 1;
}

/* Memories Image */
.memories {
    position: absolute;
    top: 120px;
    left: 260px;
    width: 260px;
    transform: rotate(-5deg);
    box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    border-radius: 6px;
    z-index: 5;
}

/* Calendar */
.calendar {
    position: absolute;
    top: 90px;
    left: 420px;
    width: 220px;
    background: #f8f4ef;
    padding: 15px;
    transform: rotate(4deg);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    border-radius: 8px;
    font-size: 13px;
    z-index: 6;
}

.calendar h3 {
    margin: 0 0 8px 0;
    font-weight: 500;
}

.calendar table {
    width: 100%;
    text-align: center;
    border-collapse: collapse;
}

.calendar th {
    font-size: 10px;
    color: #b3375b;
}

.calendar td {
    padding: 6px;
    position: relative;
}

/* Highlight 14 */
.highlight {
    color: #b3375b;
    font-weight: bold;
    position: relative;
}

/* Tiny hearts inside 14 */
.mini-heart {
    font-size: 8px;
    position: absolute;
    color: #ff5c8a;
}

.mini-heart.first {
    font-size: 8px;
    top: 2px;
    right: 4px;
}

.mini-heart.second {
    bottom: 2px;
    left: 4px;
}

/* Decorative heart near calendar */
.decor-heart {
    position: absolute;
    top: 70px;
    left: 470px;
    font-size: 20px;
    z-index: 7;
}

/* Title */
.title {
    font-family: 'Great Vibes', cursive;
    font-size: 95px;
    line-height: 1.1;
    margin-bottom: 30px;
}

/* Message */
.message {
    font-size: 22px;
    line-height: 1.8;
    max-width: 650px;
}

/* Heart Button */
.heart-btn {
    margin-top: 60px;
    width: 130px;
    height: 115px;
    background: linear-gradient(to bottom, #ffb6c1, #ff8fa3);
    clip-path: path("M65 105 C10 65 0 45 0 30 C0 15 20 0 40 0 C55 0 65 20 65 20 C65 20 75 0 95 0 C115 0 130 15 130 30 C130 45 120 65 65 105 Z");
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #7b1e3c;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    z-index: 10;
}

.heart-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 12px 25px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<!-- LEFT BACKGROUND -->
<div class="left-side"></div>

<!-- Scrapbook Elements -->
<img src="image/memories.jpeg" class="memories">

<div class="calendar">
    <h3>February 2026</h3>
    <table>
        <tr>
            <th>S</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th>
        </tr>
        <tr>
            <td></td><td></td><td></td><td></td><td></td><td></td><td>1</td>
        </tr>
        <tr>
            <td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td>
        </tr>
        <tr>
            <td>9</td><td>10</td><td>11</td><td>12</td><td>13</td>
            <td class="highlight">
                14
                <span class="mini-heart first">💕</span>
                <!-- <span class="mini-heart second">💕</span> -->
            </td>
            <td>15</td>
        </tr>
        <tr>
            <td>16</td><td>17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td>
        </tr>
        <tr>
            <td>23</td><td>24</td><td>25</td><td>26</td><td>27</td><td>28</td><td></td>
        </tr>
    </table>
</div>

<div class="decor-heart">💕</div>

<!-- RIGHT CONTENT -->
<div class="right-side">

    <div class="title">
        Happy <br> Valentine’s Day
    </div>

    <div class="message">
        This Valentine's Day, I'm just grateful for us—
        for every moment we've shared and for choosing
        each other every day. You're my favourite, always.
    </div>

    <div class="heart-btn" onclick="goToMemories()">
        CLICK<br>ME
    </div>

</div>

<script>
function goToMemories() {
    document.body.classList.add("fade-out");
    setTimeout(function() {
        window.location.href = "memories.html";
    }, 800);
}
</script>

</body>
</html>
