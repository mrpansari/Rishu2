<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Me ❤️</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden;
        background: url("image/envelope.jpg") no-repeat center center;
        background-size: cover;
        position: relative;
        perspective: 1200px; /* REQUIRED for 3D */
    }

    /* Invisible clickable stamp area */
    .stamp-click {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        cursor: pointer;

        top: 52%;
        left: 50%;
        transform: translate(-50%, -50%);

        z-index: 10; /* Must be above flap */
    }

    /* Flap animation */
    .flap {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 50%;
        background: url("image/envelope.jpg") no-repeat center top;
        background-size: cover;
        transform-origin: top;
        transition: transform 1.2s ease;
        z-index: 5;
        backface-visibility: hidden;
    }

</style>
</head>

<body>

<div class="flap" id="flap"></div>
<div class="stamp-click" id="stamp"></div>

<script>
    const stamp = document.getElementById("stamp");
    const flap = document.getElementById("flap");

    const waxSound = new Audio("sound/wax.mp3");
    const paperSound = new Audio("sound/paper.mp3");

    stamp.addEventListener("click", function() {

        // Prevent double clicking
        stamp.style.pointerEvents = "none";

        // Play wax sound
        waxSound.play().catch(() => {});

        // After wax sound starts → open flap + paper sound
        setTimeout(() => {
            flap.style.transform = "rotateX(-180deg)";
            paperSound.play().catch(() => {});
        }, 400);

        // Redirect after animation
        setTimeout(() => {
            window.location.href = "opened-letter.html";
        }, 2500);
    });
</script>

</body>
</html>
