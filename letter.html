<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Wrapper keeps image ratio intact */
.wrapper {
    position: relative;
    max-width: 100%;
    max-height: 100%;
}

/* The letter image */
.wrapper img {
    width: 100%;
    height: auto; /* VERY IMPORTANT */
    display: block;
}

/* Clickable stamp area */
.stamp {
    position: absolute;
    width: 12%;       /* Responsive sizing */
    aspect-ratio: 1/1;
    bottom: 25%;      /* Adjust this slightly if needed */
    left: 50%;
    transform: translateX(-50%);
    cursor: pointer;
}

</style>
</head>

<body>

<div class="wrapper">
    <img src="letter.jpg" alt="Letter">
    <div class="stamp" onclick="openLetter()"></div>
</div>

<script>
function openLetter() {
    window.location.href = "opened-letter.html";
}
</script>

</body>
</html>
