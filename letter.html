<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Envelope container */
.envelope-container {
    position: relative;
    width: 90vw;
    max-height: 90vh;
}

/* Image */
.envelope-container img {
    width: 100%;
    height: auto;
    display: block;
}

/* Stamp clickable area */
.stamp {
    position: absolute;
    width: 8%;
    aspect-ratio: 1 / 1;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
}

</style>
</head>
<body>

<div class="envelope-container">
    <img src="envelope.jpg" alt="Envelope">
    <div class="stamp" onclick="openLetter()"></div>
</div>

<script>

function openLetter() {

    const waxSound = new Audio("wax.mp3");
    const paperSound = new Audio("paper.mp3");

    // Play wax crack sound
    waxSound.play();

    // After slight delay, play paper sound
    setTimeout(function() {
        paperSound.play();
    }, 400);

    // Redirect after sounds finish
    setTimeout(function() {
        window.location.href = "memories.html";
    }, 2500);
}

</script>

</body>
</html>
