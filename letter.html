<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
    overflow: hidden;
}

/* Fullscreen background image without distortion */
.letter-page {
    position: fixed;
    width: 100vw;
    height: 100vh;
    background-image: url("letter.jpg"); /* your image file name */
    background-size: contain;   /* IMPORTANT */
    background-position: center;
    background-repeat: no-repeat;
}

/* Clickable stamp area */
.stamp {
    position: absolute;
    width: 120px;
    height: 120px;
    bottom: 28%;
    left: 50%;
    transform: translateX(-50%);
    cursor: pointer;
}

</style>
</head>

<body>

<div class="letter-page">
    <div class="stamp" onclick="openLetter()"></div>
</div>

<script>
function openLetter() {
    window.location.href = "opened-letter.html";
}
</script>

</body>
</html>
