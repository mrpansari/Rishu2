<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Me ❤️</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden;
        background: url("envelope.jpg") no-repeat center center;
        background-size: cover;
        position: relative;
    }

    /* Invisible clickable stamp area */
    .stamp-click {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        cursor: pointer;

        /* Adjust these values if needed */
        top: 52%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    /* Flap animation overlay */
    .flap {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 50%;
        background: url("envelope.jpg") no-repeat center top;
        background-size: cover;
        transform-origin: top;
        transition: transform 1.2s ease;
        z-index: 5;
    }

    .open .flap {
        transform: rotateX(-180deg);
    }

    .fade-out {
        animation: fadeOut 1s forwards;
    }

    @keyframes fadeOut {
        to {
            opacity: 0;
        }
    }

</style>
</head>

<body>

<div class="flap" id="flap"></div>
<div class="stamp-click" id="stamp"></div>

<script>
    const stamp = document.getElementById("stamp");
    const flap = document.getElementById("flap");

    const waxSound = new Audio("wax.mp3");
    const paperSound = new Audio("paper.mp3");

    stamp.addEventListener("click", function() {

        waxSound.play();

        setTimeout(() => {
            flap.style.transform = "rotateX(-180deg)";
            paperSound.play();
        }, 400);

        // After animation → go to memory page
        setTimeout(() => {
            window.location.href = "memories.html";
        }, 2500);
    });
</script>

</body>
</html>
